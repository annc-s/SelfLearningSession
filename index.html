<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>d&i Leaders Disability at Work Online Summit 2026</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,sans-serif;background:#F8F9FA;color:#1e293b;padding:20px}
  .wrap{max-width:800px;margin:0 auto}
  .header{background:#1B2A4A;border-radius:12px;padding:20px 24px;color:white;margin-bottom:16px}
  .header-sub{font-size:11px;opacity:.7;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
  .header-title{font-size:22px;font-weight:600;margin-bottom:4px}
  .header-meta{font-size:13px;opacity:.8}

  .login-box{background:#FFF;border:2px solid #3B82F6;border-radius:10px;padding:14px 18px;margin-bottom:16px;display:flex;align-items:flex-start;gap:14px}
  .login-icon{background:#DBEAFE;border-radius:8px;padding:8px;flex-shrink:0;font-size:20px;line-height:1}
  .login-title{font-size:13px;font-weight:700;color:#1D4ED8;margin-bottom:6px}
  .login-row{font-size:13px;color:#374151;margin-bottom:4px;line-height:1.5}
  .login-row a{color:#2563EB;text-decoration:none;word-break:break-all}
  .login-row a:hover{text-decoration:underline}
  .login-row strong{color:#111827}

  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .filter-btn{padding:6px 16px;border-radius:20px;border:1.5px solid #CBD5E1;cursor:pointer;font-size:12px;font-weight:600;background:#fff;color:#475569;transition:all .15s}
  .filter-btn.active-all{background:#1B2A4A;color:white;border-color:#1B2A4A}
  .filter-btn.active-session{background:#3B82F6;color:white;border-color:#3B82F6}
  .filter-btn.active-networking{background:#22C55E;color:white;border-color:#22C55E}
  .filter-btn.active-qa{background:#F97316;color:white;border-color:#F97316}
  .filter-btn.active-chair{background:#8B5CF6;color:white;border-color:#8B5CF6}

  .sessions{display:flex;flex-direction:column;gap:8px}
  .session{border-radius:10px;border:1.5px solid #E2E8F0;background:#fff;overflow:hidden;transition:border-color .15s}
  .session-header{padding:13px 16px;display:flex;align-items:center;gap:12px;cursor:pointer}
  .time{font-size:12px;font-weight:600;color:#64748B;min-width:42px}
  .session-info{flex:1}
  .session-title{font-size:14px;font-weight:600;line-height:1.4;color:#0F172A}
  .session-speakers{font-size:12px;color:#64748B;margin-top:3px}
  .badge{border-radius:20px;padding:3px 11px;font-size:11px;font-weight:700;flex-shrink:0}
  .chevron{font-size:13px;color:#94A3B8;flex-shrink:0}

  .session-body{padding:0 16px 16px;border-top:1.5px solid #F1F5F9}
  .section-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin:12px 0 8px}
  .topic{font-size:13px;padding:5px 0;border-bottom:1px solid #F1F5F9;display:flex;gap:8px;align-items:flex-start;color:#475569}
  .topic:last-child{border-bottom:none}
  .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:5px}

  .speaker-card{background:#F8FAFC;border:1px solid #E2E8F0;border-radius:8px;margin-top:8px;overflow:hidden}
  .speaker-header{padding:10px 14px;cursor:pointer;display:flex;align-items:center;justify-content:space-between}
  .avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
  .speaker-name{font-size:13px;font-weight:600;color:#0F172A}
  .speaker-role{font-size:12px;color:#64748B;margin-top:1px}
  .speaker-bio{font-size:13px;color:#475569;line-height:1.6;padding:10px 14px 12px;border-top:1px solid #E2E8F0}

  .footer{text-align:center;font-size:12px;color:#94A3B8;margin-top:24px;padding-top:16px;border-top:1px solid #E2E8F0}
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div class="header-sub">d&i Leaders</div>
    <div class="header-title">Disability at Work Online Summit 2026</div>
    <div class="header-meta">Full day programme &nbsp;·&nbsp; 08:40 – 17:30 BST</div>
  </div>

  <div class="login-box">
    <div class="login-icon">🔐</div>
    <div>
      <div class="login-title">Access On-Demand Recordings</div>
      <div class="login-row">🔗 <a href="https://dileaders.com/disabilitysummit/on-demand-recordings/" target="_blank">https://dileaders.com/disabilitysummit/on-demand-recordings/</a></div>
      <div class="login-row">🔑 <strong>Password:</strong> DLds8319</div>
    </div>
  </div>

  <div class="filters" id="filters"></div>
  <div class="sessions" id="sessions"></div>

  <div class="footer">d&i Leaders Disability at Work Online Summit 2026 · All times BST</div>
</div>

<script>
const T = {
  session:    {label:"Session",    bg:"#EFF6FF",border:"#3B82F6",text:"#1D4ED8",badge:"#DBEAFE",badgeT:"#1E40AF",av:"#BFDBFE",avT:"#1E40AF"},
  networking: {label:"Networking", bg:"#F0FDF4",border:"#22C55E",text:"#15803D",badge:"#DCFCE7",badgeT:"#166534",av:"#BBF7D0",avT:"#166534"},
  qa:         {label:"Q&A",        bg:"#FFF7ED",border:"#F97316",text:"#C2410C",badge:"#FFEDD5",badgeT:"#9A3412",av:"#FED7AA",avT:"#9A3412"},
  chair:      {label:"Chair",      bg:"#F5F3FF",border:"#8B5CF6",text:"#6D28D9",badge:"#EDE9FE",badgeT:"#5B21B6",av:"#DDD6FE",avT:"#5B21B6"},
  welcome:    {label:"Welcome",    bg:"#FDF2F8",border:"#D946EF",text:"#A21CAF",badge:"#FAE8FF",badgeT:"#86198F",av:"#F5D0FE",avT:"#86198F"},
  close:      {label:"Close",      bg:"#FFF1F2",border:"#F43F5E",text:"#BE123C",badge:"#FFE4E6",badgeT:"#9F1239",av:"#FECDD3",avT:"#9F1239"},
};

const SESSIONS = [
  {time:"08:40",title:"Online networking",type:"networking"},
  {time:"09:00",title:"Welcome",type:"welcome",speakers:[{name:"Mark Baker",role:"Founder · d&i Leaders",init:"MB",bio:"Mark has decades of experience connecting business communities to accelerate change. He founded Sircula Ltd and launched d&i Leaders in 2018. The d&i Leaders Club now has 10,000+ member organisations."}]},
  {time:"09:05",title:"Chair's opening remarks",type:"chair",speakers:[{name:"Kate Nash OBE",role:"Author & Founder · PurpleSpace",init:"KN",bio:"Kate is founder of PurpleSpace — the world's only global network of disability ERG leaders, with 4,000+ leaders across 175+ employer brands. Her book Positively Purple won Business Book of the Year 2023 (DEI). She was awarded an OBE for services to disabled people in 2007."}]},
  {time:"09:10",title:"Using data to inform your disability inclusion strategy",type:"session",points:["Auditing existing data across multiple countries","The value of trust building","Gathering data and reaching those without access","Data alignment and business impact","Best practice example from UK"],speakers:[{name:"Joanne Sime",role:"Head of Global Inclusion, Wellbeing & Culture · TUI Group",init:"JS",bio:"Joanne leads work that strengthens belonging, psychological safety and sustainable performance across diverse global teams. She focuses on embedding inclusion into everyday ways of working rather than standalone initiatives."},{name:"Emily Hyland",role:"Senior Inclusion & Wellbeing Manager · TUI Group",init:"EH",bio:"Emily believes inclusion is built through small, everyday actions. Her approach draws on lived experience of disability and a Churchill Fellowship on inclusive wellbeing (2023)."}]},
  {time:"09:30",title:"Disability enablement by design: Building accessibility into the way we work",type:"session",points:["How Shell has designed and embedded workplace accessibility","Applying systems thinking across functions, ERGs, and leadership","Partnering externally to strengthen the disability inclusion ecosystem"],speakers:[{name:"Vishal Kumar",role:"Global Enablement & DEI Adviser · Shell",init:"VK",bio:"Vishal leads disability inclusion globally at Shell with over 14 years of HR experience. As a professional with blindness, he brings a grounded, systems-level perspective on how organisations design, embed, and sustain accessibility and inclusion."}]},
  {time:"09:50",title:"Getting leadership commitment in driving your disability inclusion strategy",type:"session",points:["Why disability inclusion commitment from leadership matters","How a new LSEG campaign is driving disability inclusion","Keeping the dial moving forward"],speakers:[{name:"Katherine Gansallo",role:"D&I Director, UK, EMEA & Group · LSEG",init:"KG",bio:"Katherine is an international HR and talent executive with 15+ years' experience. Her initiatives have included increasing female representation in senior leadership from 31% to 40%."}]},
  {time:"10:10",title:"Live audience Q&A",type:"qa"},
  {time:"10:40",title:"Break & online networking",type:"networking"},
  {time:"11:10",title:"In conversation: Supporting working parents and carers",type:"session",points:["Working with a disability whilst caring for four family members","How Carers and Disability ERGs at HSBC are joining forces","Support making a positive difference for carers","How these fit with their wider disability strategy"],speakers:[{name:"Jo Austin",role:"Global Inclusion Delivery Manager · HSBC",init:"JA",bio:"Jo cares for four members of her family in addition to having her own disability. She was included in the Shaw Trust Power 100 in 2022 and attended a reception at Windsor Castle recognising her role as a carer."}]},
  {time:"11:30",title:"Embedding inclusive and accessible thinking into everyday decision making",type:"session",points:["Practical case study: a Skill Lab at Vodafone","Clear principles, practical frameworks and real-world approaches","Shifting mindsets around accessibility","Embedding inclusive thinking across the full product lifecycle"],speakers:[{name:"Taylor Mirkarimi",role:"Group D&I Lead · Vodafone",init:"TM",bio:"Taylor is an award-winning DEI leader with extensive experience designing and delivering global DEI strategies for complex, multinational organisations."}]},
  {time:"11:50",title:"Creating dedicated spaces that drive disability inclusion",type:"session",points:["Sanofi's Global Workplace Accessibility Standard — roadmap to 100% accessible sites by 2030","Accessibility Lounges and Pop-ups for assistive technology","How these spaces are driving culture change and continuous improvement"],speakers:[{name:"Iulia Brehuescu",role:"Global Accessibility Partner · Sanofi",init:"IB",bio:"Iulia drives the integration of accessibility into digital products, physical environments, and workplace culture at Sanofi. She holds the CPACC credential and has spoken at the Zero Project and the ILO Global Business and Disability Network."}]},
  {time:"12:05",title:"The hidden cost of coping: Unlocking potential through neuroinclusion",type:"session",points:["The hidden cost of masking dyslexia in the workplace","How removing barriers helps neurodivergent people thrive","Why neuroinclusion unlocks talent, innovation and performance"],speakers:[{name:"Ashleigh Moore",role:"Director of Neuroinclusive Workplaces · Everway",init:"AM",bio:"Ashleigh is a dyslexic leader who combines lived experience with practical insight to help organisations understand the hidden cost of masking and the impact of accessible, inclusive workplaces."}]},
  {time:"12:20",title:"Live audience Q&A",type:"qa"},
  {time:"12:50",title:"Morning chair's closing remarks",type:"chair",speakers:[{name:"Kate Nash OBE",role:"Author & Founder · PurpleSpace",init:"KN",bio:"Kate is founder of PurpleSpace — the world's only global network of disability ERG leaders. Her book Positively Purple won Business Book of the Year 2023 (DEI)."},{name:"Dr Shani Dhanda",role:"Inclusion & Accessibility Specialist & Broadcaster",init:"SD",bio:"Recognised as the UK's most influential disabled person and a BBC 100 Women Laureate, trusted by over 350 businesses to integrate accessibility into their strategies. She has spoken at 400+ events including the United Nations and TEDx."}]},
  {time:"12:55",title:"Lunch break & online networking",type:"networking"},
  {time:"13:50",title:"In conversation: From ERG disability lead to D&I decision maker",type:"session",points:["Navigating the world of work with a disability","Moving from ERG leader at Nestlé into a D&I role","Creating tools to accelerate disability inclusion","Making a difference as both influencer and decision maker"],speakers:[{name:"Rachel Haynes",role:"Global D&I Manager · Nestlé",init:"RH",bio:"Rachel provides strategic direction for DE&I initiatives across 188 countries. Prior to Nestlé, she spent her career in health and disability communications and advocacy."}]},
  {time:"14:05",title:"Setting global standards for disability inclusion",type:"session",points:["The thinking and policy behind this new initiative","Rolling out standards worldwide across countries","Using data to inform progress and your disability inclusion strategy"],speakers:[{name:"Buks Akinseye",role:"Global EDI Manager · IKEA",init:"BA",bio:"Buks is the Global EDI Manager at Ingka Group, the largest IKEA franchisee accounting for over 90% of total IKEA sales. With nearly 20 years of experience, his work sits at the intersection of business, public policy, and societal impact."}]},
  {time:"14:25",title:"Access, AI, and ambition: Digital accessibility as a talent strategy",type:"session",points:["The business case for digital accessibility as a talent retention strategy","The engage, equip, embed framework","AI and Assistive Technology taking productivity to the next level","Tips for getting started"],speakers:[{name:"Darren Rowan",role:"Senior Director of Digital Accessibility · Eli Lilly",init:"DR",bio:"Darren leads an enterprise strategy and global team to embed accessibility at Lilly. He co-founded the EnAble ERG in 2015 and is a PurpleSpace Ambassador. Darren has been blind since the age of 18."}]},
  {time:"14:45",title:"Live audience Q&A",type:"qa"},
  {time:"15:15",title:"Break & online networking",type:"networking"},
  {time:"15:40",title:"Against the odds: Creating opportunities for blind and partially-sighted interns",type:"session",points:["Channel 4's commitment to creating opportunities for all backgrounds","What makes a successful internship","Background to the Get Set, Progress Internships","Life as an intern and how to get involved"],speakers:[{name:"Jamie Ward",role:"Former Head of Talent & Learning · Channel 4",init:"JW",bio:"Jamie is severely sight-impaired due to a genetic condition and a strong supporter of challenging negative stereotypes around disability. He holds a PhD in organisational behaviour and an MBA from Imperial College London."},{name:"Charlie Rashbrook",role:"Internship Co-ordinator · Thomas Pocklington Trust",init:"CR",bio:"Charlie supports the Get Set Progress internship programme. He has been visually impaired since birth and has himself taken part in the programme he now delivers."},{name:"Carys Hall",role:"Audience Insights Intern · Channel 4",init:"CH",bio:"Carys was an audience insights intern at Channel 4 through the Thomas Pocklington Trust's Get Set Progress scheme. She was born registered totally blind."}]},
  {time:"16:00",title:"Disability inclusive talent attraction and recruitment",type:"session",points:["How KPMG is reducing barriers in hiring practices","Delivering real change in disability inclusion"],speakers:[{name:"Mark Russell",role:"IDE Manager · KPMG UK",init:"MR",bio:"Mark has worked in KPMG's IDE team for 9 years, leading on firm-wide initiatives including thought leadership, benchmarks, advocacy, policies, events and campaigns."},{name:"Emily Carlson",role:"Digital Accessibility Lead · KPMG UK",init:"EC",bio:"Emily leads KPMG's Digital Accessibility team, working to ensure the firm and the technology they create is accessible to everyone."}]},
  {time:"16:20",title:"Activating your disability employee networks and resource groups",type:"session",points:["How Able2 rebuilt its network after changing platforms — 750+ newsletter subscribers","Networks helping shape workplace adjustments ('Passports')","How HR teams used network feedback to shape a new process in Q1 2026"],speakers:[{name:"Edward Mitchell",role:"Service Designer & Co-chair, able2 · BT",init:"EM",bio:"Ed is the co-chair of BT's people network for disabilities, neurodiversities, impairments and long-term conditions. He has been passionate about inclusion since being diagnosed with Autism at age 7."}]},
  {time:"16:40",title:"Live audience Q&A",type:"qa"},
  {time:"17:10",title:"Chair's closing remarks",type:"chair",speakers:[{name:"Dr Shani Dhanda",role:"Inclusion & Accessibility Specialist & Broadcaster",init:"SD",bio:"Recognised as the UK's most influential disabled person and a BBC 100 Women Laureate, trusted by over 350 businesses to integrate accessibility into their strategies."}]},
  {time:"17:15",title:"Online networking",type:"networking"},
  {time:"17:30",title:"Close of summit",type:"close"},
];

let activeFilter = "all";
const openSessions = new Set();
const openSpeakers = new Set();

function render() {
  const filtersEl = document.getElementById("filters");
  const sessionsEl = document.getElementById("sessions");
  const allFilters = ["all","session","networking","qa","chair"];

  filtersEl.innerHTML = allFilters.map(f => {
    const t = T[f] || T.session;
    const active = activeFilter === f;
    const activeCls = active ? `active-${f}` : "";
    return `<button class="filter-btn ${activeCls}" onclick="setFilter('${f}')">${f==="all"?"All sessions":t.label}</button>`;
  }).join("");

  const filtered = activeFilter === "all" ? SESSIONS : SESSIONS.filter(s =>
    s.type === activeFilter || (activeFilter === "chair" && ["welcome","close"].includes(s.type))
  );

  sessionsEl.innerHTML = filtered.map((s, i) => {
    const t = T[s.type] || T.session;
    const open = openSessions.has(i);
    const simple = ["networking","close"].includes(s.type);
    return `
    <div class="session" style="border-color:${open ? t.border : "#E2E8F0"};${open ? `background:${t.bg}` : ""}">
      <div class="session-header" onclick="${simple ? "" : `toggleSession(${i})`}" style="cursor:${simple?"default":"pointer"}">
        <div class="time">${s.time}</div>
        <div class="session-info">
          <div class="session-title">${s.title}</div>
          ${s.speakers?.length ? `<div class="session-speakers">${s.speakers.map(sp=>sp.name).join(" · ")}</div>` : ""}
        </div>
        <span class="badge" style="background:${t.badge};color:${t.badgeT}">${t.label}</span>
        ${!simple ? `<span class="chevron">${open?"▲":"▼"}</span>` : ""}
      </div>
      ${open && !simple ? `
      <div class="session-body">
        ${s.points ? `
          <div class="section-label" style="color:${t.text}">Key topics</div>
          ${s.points.map(p=>`<div class="topic"><div class="dot" style="background:${t.border}"></div>${p}</div>`).join("")}
        ` : ""}
        ${s.speakers?.length ? `
          <div class="section-label" style="color:${t.text};margin-top:${s.points?"14px":"10px"}">Speaker${s.speakers.length>1?"s":""}</div>
          ${s.speakers.map((sp,j) => {
            const key = `${i}-${j}`;
            const spOpen = openSpeakers.has(key);
            return `
            <div class="speaker-card">
              <div class="speaker-header" onclick="toggleSpeaker('${key}')">
                <div style="display:flex;align-items:center;gap:10px">
                  <div class="avatar" style="background:${t.av};color:${t.avT}">${sp.init}</div>
                  <div>
                    <div class="speaker-name">${sp.name}</div>
                    <div class="speaker-role">${sp.role}</div>
                  </div>
                </div>
                <span class="chevron">${spOpen?"▲":"▼"}</span>
              </div>
              ${spOpen ? `<div class="speaker-bio">${sp.bio}</div>` : ""}
            </div>`;
          }).join("")}
        ` : ""}
      </div>` : ""}
    </div>`;
  }).join("");
}

function setFilter(f) { activeFilter = f; openSessions.clear(); render(); }
function toggleSession(i) { openSessions.has(i) ? openSessions.delete(i) : openSessions.add(i); render(); }
function toggleSpeaker(k) { openSpeakers.has(k) ? openSpeakers.delete(k) : openSpeakers.add(k); render(); }

render();
</script>
</body>
</html>
